name: SignalDesk checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signaldesk
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: signaldesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signaldesk -d signaldesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://signaldesk:ci-test-only@127.0.0.1:5432/signaldesk_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-test-only
      - run: docker build -t signaldesk:ci .
      - name: Verify container startup and HTTP health
        run: |
          docker run -d --name signaldesk-ci --network host \
            -e NODE_ENV=development \
            -e APP_ORIGIN=http://localhost:3000 \
            -e DATABASE_URL=postgresql://signaldesk:ci-test-only@127.0.0.1:5432/signaldesk_test \
            -e REDIS_URL=redis://127.0.0.1:6379 signaldesk:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs signaldesk-ci
          exit 1
      - if: always()
        run: docker rm -f signaldesk-ci || true
